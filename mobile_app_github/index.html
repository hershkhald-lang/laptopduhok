<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Duhok POS - ڤەگوهاستن</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d111a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        /* Card Container */
        .card {
            background: #151b26;
            border: 1px solid #223047;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        /* Logo/Icon Style */
        .logo-container {
            margin-bottom: 24px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(242, 143, 29, 0.1);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: #f28f1d;
            border: 2px dashed #f28f1d;
        }
        /* Typography */
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
        }
        h2 {
            font-size: 18px;
            color: #f28f1d;
            margin-bottom: 20px;
            font-weight: 600;
        }
        p.description {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        /* Countdown Text */
        .countdown-text {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .countdown-num {
            color: #f28f1d;
            font-weight: bold;
            font-size: 18px;
        }
        /* Button Style */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .btn:active {
            transform: translateY(0);
        }
        /* Footer Brand */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Icon -->
        <div class="logo-container">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="2" y1="20" x2="22" y2="20"></line>
                    <line x1="12" y1="17" x2="12" y2="20"></line>
                </svg>
            </div>
        </div>

        <!-- Title & Badini Headers -->
        <h1>Laptop Duhok POS</h1>
        <h2>ئەڤ لینکە هاتیە گوهۆڕین!</h2>
        
        <!-- Description in Badini -->
        <p class="description">
            کاربەرێن هێژا، ئەڤ لینکێ کۆن ئێدی کار ناکەت. بۆ دیتنا سیستمێ نوو و بەردەوامبوونا کارێ خۆ، هیڤییە سەرەدانا لینکێ فەرمی یێ خوارێ بکەن.
        </p>

        <!-- Countdown Timer -->
        <div class="countdown-text">
            دێ هێیە ڤەگوهاستن بۆ لینکێ نوو د ماوێ <span class="countdown-num" id="seconds">5</span> چرکەیاندا...
        </div>

        <!-- Action Button -->
        <a href="#" id="redirect-btn" class="btn">
            چوون بۆ لینکێ نوو
        </a>

        <!-- Footer -->
        <div class="footer">
            Laptop Duhok POS © 2026
        </div>
    </div>

    <script>
        // لێرەدا لێنکێ خۆ یێ نوو دابنە (Replace with your new system URL)
        const NEW_URL = "https://laptopduhokpos.github.io/LP/"; 

        // Update button link
        const btn = document.getElementById('redirect-btn');
        btn.href = NEW_URL;

        // Countdown script
        let secondsLeft = 5;
        const secondsSpan = document.getElementById('seconds');

        const countdownInterval = setInterval(() => {
            secondsLeft--;
            secondsSpan.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = NEW_URL;
            }
        }, 1000);
    </script>

</body>
</html>
